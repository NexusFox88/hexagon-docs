name: Publish blog to website
on:
  push:
    branches: [main]
    paths: ['blog/**', '.github/workflows/publish-blog.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-blog-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request website rebuild
        env:
          WEBSITE_DEPLOY_HOOK: ${{ secrets.WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$WEBSITE_DEPLOY_HOOK" ]; then
            echo 'Missing WEBSITE_DEPLOY_HOOK repository secret.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 --request POST "$WEBSITE_DEPLOY_HOOK" --output /dev/null
          echo 'Website rebuild requested. Verify Cloudflare build completion and /blog/source.json before calling the article published.'
